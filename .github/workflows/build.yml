name: build
on:
  push:
    branches:
      - main
      - workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup ZDE
        uses: zoul0813/zeal-dev-environment/github/setup-zde@main
        with:
          deps: zealfs coreutils zshell

      - name: Stage coreutils
        run: |
          zde deps stage romdisk coreutils

      - name: Stage ZShell
        run: |
          zde deps stage romdisk zshell

      - name: Build with ZDE
        run: |
          zde cmake \
          && mkdir -p ${{ github.workspace }}/.deploy/hostfs/bin \
          && mkdir -p ${{ github.workspace }}/.deploy/hostfs/runtime \
          && mkdir -p ${{ github.workspace }}/.deploy/hostfs/tests \
          && cp bin/* ${{ github.workspace }}/.deploy/hostfs/bin \
          && cp tests/* ${{ github.workspace }}/.deploy/hostfs/tests \
          && cp runtime/* ${{ github.workspace }}/.deploy/hostfs/runtime \
          && python3 - <<'PY'
          import json
          import os
          root = os.path.join(os.environ["GITHUB_WORKSPACE"], ".deploy", "hostfs")
          paths = []
          for dirpath, _, files in os.walk(root):
              for filename in files:
                  if filename == "index.json":
                      continue
                  full_path = os.path.join(dirpath, filename)
                  rel_path = os.path.relpath(full_path, root).replace(os.sep, "/")
                  paths.append(rel_path)
          paths.sort()
          with open(os.path.join(root, "index.json"), "w") as handle:
              json.dump(paths, handle)
          PY

      - name: Create eeprom.img
        run: |
          zde image eeprom add .deploy/eeprom
          zde image eeprom create 64 # custom eeprom image
          cp $ZDE_PATH/mnt/eeprom.img ${{ github.workspace }}/.deploy/eeprom.img

      - name: Build Kernel/Romdisk
        env:
          ZDE_USER_PATH: ${{ github.workspace }}/.deploy
        run: |
          zde kernel user
          cp $ZDE_PATH/home/Zeal-8-bit-OS/build/os_with_romdisk.img bin/default.img
          cp $ZDE_PATH/home/Zeal-8-bit-OS/build/os_with_romdisk.img .deploy/default.img

      - name: Deploy
        uses: ./.github/actions/deploy-pages

      # - name: Upload binaries
      #   uses: actions/upload-artifact@v4
