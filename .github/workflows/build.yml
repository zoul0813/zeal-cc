name: build
on:
  push:
    branches:
      - main
      - workflow
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZDE_USE: docker
      ZDE_STRICT_EXIT: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup ZDE
        uses: zoul0813/zeal-dev-environment/github/setup-zde@main
        with:
          deps: zealfs coreutils zshell Zeal8bit/Zeal-Disk-Tool Zeal8bit/Zeal-NativeEmulator

      - name: Build and test installed compiler
        run: |
          make test
          make dist test-media
          zde --no-tty exec zeal-headless --skill
          zde --no-tty exec python3 test.py --headless-only --no-build
          zde --no-tty exec python3 test.py --debug-smoke --no-build

      - name: Retain failing guest runs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guest-diagnostics
          path: tests/audit/guest-*/

      - name: Upload tested hardware installation
        uses: actions/upload-artifact@v4
        with:
          name: zeal-cc
          path: dist/zeal-cc/
          if-no-files-found: error

      - name: Stage Pages demo
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/workflow'
        run: zde --no-tty exec python3 stage.py

      - name: Create eeprom.img
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/workflow'
        run: |
          zde image eeprom add .deploy/eeprom
          zde image eeprom create 64 # custom eeprom image
          cp $ZDE_PATH/mnt/eeprom.img ${{ github.workspace }}/.deploy/eeprom.img

      - name: Build Kernel/Romdisk
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/workflow'
        env:
          ZDE_USER_PATH: ${{ github.workspace }}/.deploy
        run: |
          zde kernel user
          cp $ZDE_PATH/home/Zeal-8-bit-OS/build/os_with_romdisk.img bin/default.img
          cp $ZDE_PATH/home/Zeal-8-bit-OS/build/os_with_romdisk.img .deploy/default.img

      - name: Upload Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .deploy

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/workflow'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
